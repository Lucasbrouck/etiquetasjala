<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Etiquetas Jalapeño - Mobile</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  
  <!-- TELA DE LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-container">
      <div class="logo"><i data-lucide="tag" style="width:48px;height:48px;color:var(--primary);"></i></div>
      <h1>Etiquetas Jalapeño</h1>
      <p class="subtitle">Mobile</p>
      
      <div class="form-group">
        <label>ID da Loja</label>
        <input type="text" id="loginStoreId" placeholder="Ex: matriz" autocapitalize="none">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" placeholder="******">
      </div>
      
      <button class="btn btn-primary btn-block mt-3" id="btnLogin">Acessar</button>
      <p id="loginError" class="error-msg"></p>
      
      <div id="windowsDownloadContainer" style="margin-top: 24px; font-size: 0.875rem;">
        <a href="https://github.com/Lucasbrouck/etiquetasjala/releases/latest" target="_blank" style="color: var(--text-muted); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;">
          <i data-lucide="download" style="width: 16px; height: 16px;"></i> Baixar App para Windows
        </a>
      </div>
    </div>
  </div>

  <!-- APLICATIVO PRINCIPAL -->
  <div id="appScreen" class="screen">
    <nav class="mobile-nav">
      <button class="nav-tab active" data-target="pdvTab">PDV</button>
      <button class="nav-tab" data-target="crudTab">Produtos</button>
      <button class="btn-icon" id="btnLogout" style="padding: 0 16px; color: var(--danger); display: flex; align-items: center;" title="Sair"><i data-lucide="log-out"></i></button>
    </nav>
    
    <div class="connection-status" id="connectionStatus">Conectado</div>

    <!-- TAB: PDV -->
    <div id="pdvTab" class="tab-content active">
      <!-- Filtro de Categoria Horizontal -->
      <div class="horizontal-scroll" id="mobileCategories">
        <!-- Preenchido via JS -->
      </div>
      
      <!-- Lista de Produtos -->
      <div class="product-list" id="mobileProducts">
        <!-- Preenchido via JS -->
      </div>
    </div>

    <!-- TAB: CRUD -->
    <div id="crudTab" class="tab-content">
      <div class="crud-header">
        <h2>Produtos</h2>
        <button class="btn btn-sm btn-primary" id="btnNewProduct" style="display: flex; align-items: center; gap: 4px;"><i data-lucide="plus" style="width:16px;height:16px;"></i> Novo</button>
      </div>
      <div class="product-list" id="mobileCrudProducts">
        <!-- Preenchido via JS -->
      </div>
    </div>

    <!-- PAINEL DA FILA (Flutuante na base) -->
    <div id="queuePanel" class="queue-panel">
      <div class="queue-header" id="queueHeader">
        <span id="queueCount">0 itens na fila</span>
        <span id="queueIcon"><i data-lucide="chevron-down"></i></span>
      </div>
      <div class="queue-body" id="queueBody">
        <!-- Preenchido via JS -->
      </div>
      <div class="queue-footer">
        <button class="btn btn-block btn-success" id="btnMobilePrint" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
          <i data-lucide="printer"></i> <span id="btnPrintText">IMPRIMIR ETIQUETAS</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DE PRODUTO -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Novo Produto</h3>
        <button class="btn-icon" id="btnCloseModal"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editProductId">
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="prodName" placeholder="Ex: Extrato de tomate">
        </div>
        <div class="form-group">
          <label>Código (Lote) <span style="font-size: 10px; color: var(--text-muted); font-weight: normal;">Deixe em branco para auto-gerar</span></label>
          <input type="text" id="prodCode" placeholder="Ex: EXT" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <div style="display: flex; gap: 8px;">
            <select id="prodCategory" style="flex: 1;"></select>
            <button class="btn btn-secondary" id="btnManageCategories" style="padding: 0 12px; height: 44px; display: flex; align-items: center; justify-content: center;"><i data-lucide="settings"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label>Refrigeração</label>
          <select id="prodRefrigeration">
            <option value="AMBIENTE">Ambiente</option>
            <option value="REFRIGERADO">Refrigerado</option>
            <option value="CONGELADO">Congelado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Dias de Validade</label>
          <input type="number" id="prodValidity" min="1">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-block btn-primary" id="btnSaveProduct">Salvar Produto</button>
      </div>
    </div>
  </div>
  
  <!-- MODAL DE CATEGORIAS -->
  <div class="modal-overlay" id="categoryModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Gerenciar Categorias</h3>
        <button class="btn-icon" id="btnCloseCatModal"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <input type="text" id="newCatName" placeholder="Nova categoria..." style="flex: 1; height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;">
          <button class="btn btn-primary" id="btnAddCategory" style="padding: 0 16px;">Adicionar</button>
        </div>
        <div class="product-list" id="catList">
          <!-- Populated via JS -->
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
